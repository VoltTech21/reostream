{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - camera control</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="sidebar">
<p class="brand">camera control</p>
<nav>
<h2>Fleet</h2>
<ul>
<li><a href="/">All cameras</a></li>
<li><a href="/fleet/apply">Fleet apply</a></li>
{{range fleet}}
<li><a href="/camera/{{.Name}}">{{.Name}}</a></li>
{{end}}
</ul>
{{with cameraOf .}}
<h2>{{.Name}}</h2>
<ul>
<li><a href="/camera/{{.Name}}">Overview</a></li>
<li><a href="/camera/{{.Name}}/settings">Settings</a></li>
<li><a href="/camera/{{.Name}}/blocks">Every block</a></li>
<li><a href="/camera/{{.Name}}/time">Time</a></li>
<li><a href="/camera/{{.Name}}/accounts">Accounts</a></li>
</ul>
{{end}}
</nav>
</div>
<main>
{{template "body" .}}
</main>
<script>
// The sidebar is the same markup on every page; which entry is current is
// worked out from the URL rather than passed down by every handler.
(function () {
  var path = location.pathname;
  var links = document.querySelectorAll('.sidebar nav a');
  var best = null;
  for (var i = 0; i < links.length; i++) {
    var href = links[i].getAttribute('href');
    if (path === href || (href !== '/' && path.indexOf(href) === 0)) {
      if (!best || href.length > best.getAttribute('href').length) best = links[i];
    }
  }
  if (best) best.setAttribute('aria-current', 'page');
})();
</script>
</body>
</html>{{end}}
