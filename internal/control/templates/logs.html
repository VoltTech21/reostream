{{define "body"}}
<h1>Logs</h1>
<label>Filter <input id="filter" placeholder="camera name"></label>
<pre id="log" style="max-height:70vh;overflow:auto;border:1px solid #8883;padding:.5rem"></pre>
<script>
const log = document.getElementById('log');
const filter = document.getElementById('filter');
function add(line) {
  if (filter.value && !line.includes(filter.value)) return;
  log.textContent += line + '\n';
  log.scrollTop = log.scrollHeight;
}
fetch('/logs/history').then(r => r.json()).then(lines => lines.forEach(add));
new EventSource('/logs/stream').onmessage = e => add(e.data);
</script>
{{end}}
