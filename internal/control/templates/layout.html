{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - reostream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="sidebar">
<p class="brand">reostream <span class="version">{{version}}</span></p>
<nav>
<ul>
<li><a href="/">Status</a></li>
<li><a href="/logs">Logs</a></li>
<li><a href="/config">Config</a></li>
<li><a href="/password">Password</a></li>
<li><a href="/setup">Setup</a></li>
</ul>
<h2>Cameras</h2>
<ul class="cameras">
<li><a href="/cameras">All cameras</a></li>
{{range fleet}}
<li><a href="/cameras/{{.Name}}"><span class="dot state-{{.State}}" style="background:currentColor"></span>{{.Name}}</a></li>
{{end}}
</ul>
</nav>
<p class="hint">Press <kbd>&#8984;K</kbd> for anything</p>
</div>
<main>
{{template "body" .}}
</main>
<script>
// The rail is the same markup on every page; which entry is current is
// worked out from the URL rather than passed down by every handler.
(function () {
  var path = location.pathname;
  var links = document.querySelectorAll('.sidebar nav a');
  var best = null;
  for (var i = 0; i < links.length; i++) {
    var href = links[i].getAttribute('href');
    if (path === href || (href !== '/' && path.indexOf(href) === 0)) {
      if (!best || href.length > best.getAttribute('href').length) best = links[i];
    }
  }
  if (best) best.setAttribute('aria-current', 'page');
})();
</script>
</body>
</html>{{end}}
